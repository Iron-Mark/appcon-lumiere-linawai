<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linaw AI Companion</title>
    <style>
      :root {
        --color-paper: #f3ebe0;
        --color-paper-raised: #faf6f0;
        --color-paper-inset: #e8dfd2;
        --color-ink: #1a1814;
        --color-ink-muted: #5c564c;
        --color-action: #4f5d2f;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--color-paper);
        color: var(--color-ink);
      }
      h1 {
        font-size: 1.1rem;
        margin-top: 0;
        margin-bottom: 8px;
      }
      p {
        font-size: 0.85rem;
        color: var(--color-ink-muted);
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <h1>Linaw AI</h1>
      <p>Adapt the format. Preserve the meaning.</p>
    </div>
  </body>
</html>
